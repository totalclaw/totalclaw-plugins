manifest_version: 1
requires_protocol_version: ">=1"
tested_with: ">=0.63.72"
name: dh-tencent-ivh
display_name: 腾讯云智能数智人(IVH)
version: 0.1.0
description: "腾讯云智能数智人:离线合成(TC3-HMAC-SHA256 签名直连,零厂商 SDK;action 面可配)+ 实时接口族(商务开白后接线);形象类型最全(2D精品/小样本/3D写实/半写实/卡通)"
author: totalclaw
kind: backend
requires_env:
  - name: TENCENTCLOUD_SECRET_ID
    description: 腾讯云 SecretId
    prompt: 请输入 腾讯云 SecretId
  - name: TENCENTCLOUD_SECRET_KEY
    description: 腾讯云 SecretKey
    prompt: 请输入 腾讯云 SecretKey
optional_env:
  - name: TENCENT_IVH_HOST
    description: API host(默认 ivh.tencentcloudapi.com;开白后按官方文档核准)
